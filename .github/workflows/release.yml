name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shellcheck:
    uses: ./.github/workflows/shellcheck.yml

  release:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Require main
      run: |
        git fetch --quiet origin main
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "Tagged commit is not on main; refusing to release" >&2
          exit 1
        fi

    - name: Verify go-run matches the tag
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        if ! grep -qxF "VERSION=\"$VERSION\"" go-run; then
          echo "go-run does not carry $VERSION:" >&2
          grep -n '^VERSION=' go-run >&2
          echo "Fix on main with: ./update-version $VERSION" >&2
          exit 1
        fi

    # go-run is a portable shell script, but mise, brew, et al.
    # pick an asset by platform-matching its NAME, then take
    # the plain executable from inside. A single bare "go-run" asset
    # matches no platform and is rejected outright. Publishing the
    # conventional names instead allows the short form:
    #   "github:grackleclub/go-run" = "v1.2.0"
    - name: Package release assets
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        mkdir -p dist
        for target in \
          x86_64-unknown-linux-gnu \
          aarch64-unknown-linux-gnu \
          x86_64-apple-darwin \
          aarch64-apple-darwin
        do
          tar -czf "dist/go-run-$VERSION-$target.tar.gz" go-run
        done
        # checksums cover the bare script and every archive, and are
        # generated from inside dist so the file lists plain names
        cp go-run dist/go-run
        (cd dist && sha256sum go-run ./*.tar.gz > SHASUMS256.txt)
        ls -l dist

    # the tag already exists, so no --target: gh releases it as-is
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ github.ref_name }}
      run: |
        gh release create "$VERSION" \
          --title "$VERSION" \
          --generate-notes \
          dist/go-run dist/*.tar.gz dist/SHASUMS256.txt

