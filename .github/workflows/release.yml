name: Release

# Bump, commit, THEN tag. The previous workflow ran on `release: published`,
# so the tag was always created before the version bump commit landed, and
# every tag shipped the previous version string.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set version in go-run
      run: ./update-version "${{ inputs.version }}"

    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: main
        commit_message: "bump version to ${{ inputs.version }}"

    - name: Generate checksums
      run: sha256sum go-run > SHASUMS256.txt

    # assets are what let ubi, mise, and brew install go-run; without them
    # a consumer has to point at a raw githubusercontent URL by hand
    - name: Tag and publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ inputs.version }}" \
          --target "$(git rev-parse HEAD)" \
          --title "${{ inputs.version }}" \
          --generate-notes \
          go-run SHASUMS256.txt
